name: Import Strict Layer archive

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import:
    if: github.event.issue.pull_request == null && github.event.comment.body == 'STRICT_IMPORT_READY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble archive from issue chunks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          repo=os.environ['REPO']; issue=os.environ['ISSUE']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          chunks={}; total=None; page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100&page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: data=json.load(r)
              if not data: break
              for item in data:
                  body=item.get('body') or ''
                  m=re.match(r'^STRICT_IMPORT_CHUNK (\d+)/(\d+)\n([A-Za-z0-9+/=]+)$', body, re.S)
                  if m:
                      i,n=int(m.group(1)),int(m.group(2)); chunks[i]=m.group(3).strip(); total=n
              if len(data)<100: break
              page+=1
          if not total or sorted(chunks)!=list(range(1,total+1)):
              raise SystemExit(f'incomplete chunks: have {sorted(chunks)}, total={total}')
          raw=base64.b64decode(''.join(chunks[i] for i in range(1,total+1)))
          open('/tmp/strict_import.tar.xz','wb').write(raw)
          print(f'reassembled {len(raw)} bytes from {total} chunks')
          PY

      - name: Replace bootstrap tree with archived worktree
        run: |
          git rm -rf .
          tar -xJf /tmp/strict_import.tar.xz
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive Strict Layer proof research through 2026-08-16'
          git push origin HEAD:main
